<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // タップしてリンクに飛ぶ機能
      AFRAME.registerComponent('click-to-link', {
        init: function () {
          const el = this.el;
          const sceneEl = el.sceneEl;
          let isTargetVisible = false;
          const targetEntity = el.closest('[mindar-image-target]');
          targetEntity.addEventListener('targetFound', () => { isTargetVisible = true; });
          targetEntity.addEventListener('targetLost', () => { isTargetVisible = false; });
          const handleTap = (evt) => {
            if (!isTargetVisible) return;
            const camera = sceneEl.camera;
            if (!camera) return;
            const mesh = el.getObject3D('mesh');
            if (!mesh) return;
            const raycaster = new THREE.Raycaster();
            let clientX = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            let clientY = evt.changedTouches ? evt.changedTouches[0].clientY : evt.clientY;
            const mouse = new THREE.Vector2(
              (clientX / window.innerWidth) * 2 - 1,
              -(clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh, true);
            if (intersects.length > 0) {
              window.location.href = 'https://isc.iwasaki.ac.jp/';
            }
          };
          if (sceneEl.hasLoaded) {
            sceneEl.canvas.addEventListener('touchend', handleTap, false);
            sceneEl.canvas.addEventListener('click', handleTap, false);
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.canvas.addEventListener('touchend', handleTap, false);
              sceneEl.canvas.addEventListener('click', handleTap, false);
            });
          }
        }
      });
    </script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true; alpha: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="character" src="./marker.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <!-- 後光レイヤー：同じ画像を薄く・大きめ・回転させて「オーラ」に見せる -->
        <a-plane
          src="#character"
          material="transparent: true; opacity: 0; shader: flat; color: #FFD9A0;"
          position="0 0 0.3"
          height="1.3"
          width="1.3"
          animation__fade="property: material.opacity; from: 0; to: 0.35; dur: 900; easing: easeOutQuad"
          animation__scale="property: scale; from: 0.6 0.6 0.6; to: 1.15 1.15 1.15; dur: 1500; easing: easeOutElastic"
          animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 14000; loop: true; easing: linear; delay: 900">
        </a-plane>

        <!-- メインキャラクター：弾むように登場 -->
        <a-plane
          class="clickable"
          click-to-link
          src="#character"
          material="transparent: true; opacity: 1; shader: flat;"
          position="0 -0.3 0.5"
          height="1"
          width="1"
          scale="0.3 0.3 0.3"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; easing: easeOutQuad"
          animation__scale="property: scale; from: 0.3 0.3 0.3; to: 1 1 1; dur: 1000; easing: easeOutElastic"
          animation__slide="property: position; from: 0 -0.3 0.5; to: 0 0 0.5; dur: 1000; easing: easeOutBack"
          animation__float="property: position; from: 0 0 0.5; to: 0 0.08 0.5; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine; delay: 1000">
        </a-plane>

        <!-- キラキラ粒：marker.pngを縮小コピーして3個散らす（専用画像不要） -->
        <a-plane src="#character" material="transparent: true; opacity: 0; shader: flat;"
          position="-0.45 0.35 0.6" height="0.15" width="0.15"
          animation__fade="property: material.opacity; from: 0; to: 0.9; dur: 400; delay: 900; easing: easeOutQuad"
          animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 3000; loop: true; easing: linear; delay: 900"
          animation__pulse="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; dur: 900; loop: true; easing: easeInOutSine; delay: 900">
        </a-plane>
        <a-plane src="#character" material="transparent: true; opacity: 0; shader: flat;"
          position="0.4 0.4 0.65" height="0.12" width="0.12"
          animation__fade="property: material.opacity; from: 0; to: 0.9; dur: 400; delay: 1100; easing: easeOutQuad"
          animation__spin="property: rotation; from: 0 0 0; to: 0 0 -360; dur: 3500; loop: true; easing: linear; delay: 1100"
          animation__pulse="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine; delay: 1100">
        </a-plane>
        <a-plane src="#character" material="transparent: true; opacity: 0; shader: flat;"
          position="0.3 -0.4 0.55" height="0.1" width="0.1"
          animation__fade="property: material.opacity; from: 0; to: 0.8; dur: 400; delay: 1300; easing: easeOutQuad"
          animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 2800; loop: true; easing: linear; delay: 1300"
          animation__pulse="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; dur: 850; loop: true; easing: easeInOutSine; delay: 1300">
        </a-plane>

        <!-- Tap Here：標準ジオメトリのリング + テキスト（画像不要） -->
        <a-ring
          position="0 -0.65 0.5"
          radius-inner="0.09"
          radius-outer="0.11"
          color="#FFFFFF"
          material="transparent: true; opacity: 0; shader: flat;"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; delay: 1200; easing: easeOutQuad"
          animation__pulse="property: scale; from: 0.85 0.85 0.85; to: 1.25 1.25 1.25; dir: alternate; dur: 800; loop: true; easing: easeInOutSine; delay: 1200">
        </a-ring>
        <a-text
          value="TAP"
          align="center"
          width="1.2"
          position="0 -0.65 0.51"
          color="#FFFFFF"
          material="transparent: true; opacity: 0;"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; delay: 1200; easing: easeOutQuad">
        </a-text>

      </a-entity>
    </a-scene>
  </body>
</html>
