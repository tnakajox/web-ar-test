<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      AFRAME.registerComponent('click-to-link', {
        init: function () {
          const el = this.el;
          const sceneEl = el.sceneEl;
          let isTargetVisible = false;

          // ターゲット認識中かどうかをフラグで管理
          const targetEntity = el.parentEl; // mindar-image-target を持つ親entity
          targetEntity.addEventListener('targetFound', () => {
            isTargetVisible = true;
          });
          targetEntity.addEventListener('targetLost', () => {
            isTargetVisible = false;
          });

          const handleTap = (evt) => {
            if (!isTargetVisible) return; // 認識してない間は判定しない

            const camera = sceneEl.camera;
            if (!camera) return;

            const mesh = el.getObject3D('mesh');
            if (!mesh) return; // meshが未生成なら何もしない

            const raycaster = new THREE.Raycaster();

            let clientX, clientY;
            if (evt.changedTouches && evt.changedTouches.length > 0) {
              clientX = evt.changedTouches[0].clientX;
              clientY = evt.changedTouches[0].clientY;
            } else {
              clientX = evt.clientX;
              clientY = evt.clientY;
            }

            const mouse = new THREE.Vector2(
              (clientX / window.innerWidth) * 2 - 1,
              -(clientY / window.innerHeight) * 2 + 1
            );

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh, true);

            console.log('tap detected, intersects:', intersects.length);

            if (intersects.length > 0) {
              window.location.href = 'https://isc.iwasaki.ac.jp/';
            }
          };

          // シーンが完全にロードされてからリスナー登録
          if (sceneEl.hasLoaded) {
            sceneEl.canvas.addEventListener('touchend', handleTap, false);
            sceneEl.canvas.addEventListener('click', handleTap, false);
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.canvas.addEventListener('touchend', handleTap, false);
              sceneEl.canvas.addEventListener('click', handleTap, false);
            });
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="myJpgImage" src="./marker.jpg">
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          class="clickable"
          click-to-link
          src="#myJpgImage"
          position="0 0 0.3"
          height="1"
          width="1"
          rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
