<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame と MindAR のライブラリ読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('click-to-link', {
        init: function () {
          this.el.addEventListener('click', function () {
            window.location.href = 'https://isc.iwasaki.ac.jp/';
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./marker.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 表示させたい3Dモデルなどを指定 -->
        <a-asset-item id="avatarModel" src="./marker.jpg"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 浮き出るオブジェクト（タップ可能） -->
        <a-gltf-model 
          class="clickable"
          click-to-link
          src="#avatarModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
