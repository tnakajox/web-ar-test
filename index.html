<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // タップしてリンクに飛ぶ機能
      AFRAME.registerComponent('click-to-link', {
        init: function () {
          const el = this.el;
          const sceneEl = el.sceneEl;
          let isTargetVisible = false;

          const targetEntity = el.parentEl;
          targetEntity.addEventListener('targetFound', () => { isTargetVisible = true; });
          targetEntity.addEventListener('targetLost', () => { isTargetVisible = false; });

          const handleTap = (evt) => {
            if (!isTargetVisible) return;
            const camera = sceneEl.camera;
            if (!camera) return;
            const mesh = el.getObject3D('mesh');
            if (!mesh) return;

            const raycaster = new THREE.Raycaster();
            let clientX = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            let clientY = evt.changedTouches ? evt.changedTouches[0].clientY : evt.clientY;

            const mouse = new THREE.Vector2(
              (clientX / window.innerWidth) * 2 - 1,
              -(clientY / window.innerHeight) * 2 + 1
            );

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh, true);

            if (intersects.length > 0) {
              window.location.href = 'https://isc.iwasaki.ac.jp/';
            }
          };

          if (sceneEl.hasLoaded) {
            sceneEl.canvas.addEventListener('touchend', handleTap, false);
            sceneEl.canvas.addEventListener('click', handleTap, false);
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.canvas.addEventListener('touchend', handleTap, false);
              sceneEl.canvas.addEventListener('click', handleTap, false);
            });
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="myJpgImage" src="./marker.jpg">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

     <a-entity mindar-image-target="targetIndex: 0">
        <!-- メインの画像 -->
        <a-plane
          class="clickable"
          click-to-link
          src="./marker.png"
          material="transparent: true"
          position="0 0 0.5" 
          height="1"
          width="1"
          rotation="0 0 0"
          animation__scale="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 800; easing: easeOutElastic;"
          animation__float="property: position; to: 0 0.1 0.5; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
        </a-plane>

        <!-- すぐ下に配置する「ここを押してね」のテキスト -->
       <!-- すぐ下に配置する「ここを押してね」のテキスト（脈打つアニメーション） -->
        <a-text
          value=">>> Tap Here! <<<"
          align="center"
          position="0 -0.6 0.5"
          color="#FF0000"
          animation__pulse="property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; dur: 600; loop: true; easing: easeInOutSine">
        </a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
