<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // タップしてリンクに飛ぶ機能（新しいタブで開く）
      AFRAME.registerComponent('click-to-link', {
        schema: { url: { type: 'string', default: 'https://isc.iwasaki.ac.jp/' } },
        init: function () {
          const el = this.el;
          const sceneEl = el.sceneEl;
          let isTargetVisible = false;
          const targetEntity = el.closest('[mindar-image-target]');
          targetEntity.addEventListener('targetFound', () => { isTargetVisible = true; });
          targetEntity.addEventListener('targetLost', () => { isTargetVisible = false; });
          const handleTap = (evt) => {
            if (!isTargetVisible) return;
            const camera = sceneEl.camera;
            if (!camera) return;
            const mesh = el.getObject3D('mesh');
            if (!mesh) return;
            const raycaster = new THREE.Raycaster();
            let clientX = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
            let clientY = evt.changedTouches ? evt.changedTouches[0].clientY : evt.clientY;
            const mouse = new THREE.Vector2(
              (clientX / window.innerWidth) * 2 - 1,
              -(clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh, true);
            if (intersects.length > 0) {
              window.open(this.data.url, '_blank');
            }
          };
          if (sceneEl.hasLoaded) {
            sceneEl.canvas.addEventListener('touchend', handleTap, false);
            sceneEl.canvas.addEventListener('click', handleTap, false);
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.canvas.addEventListener('touchend', handleTap, false);
              sceneEl.canvas.addEventListener('click', handleTap, false);
            });
          }
        }
      });
    </script>
    <style>
      body { margin: 0; overflow: hidden; }

      /* ===== CSS/JSキラキラオーバーレイ ===== */
      #sparkle-layer {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none; /* タップ判定を邪魔しない */
        z-index: 5;
        overflow: hidden;
      }
      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #FFFFFF;
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 6px 2px rgba(255,255,255,0.5);
        animation: sparkle-anim 2.2s ease-in-out infinite;
      }
      @keyframes sparkle-anim {
        0%   { opacity: 0; transform: scale(0.3) rotate(0deg); }
        50%  { opacity: 1; transform: scale(1) rotate(180deg); }
        100% { opacity: 0.5; transform: scale(0.3) rotate(360deg); }
      }
    </style>
  </head>
  <body>

    <!-- キラキラはHTML/CSSレイヤーで実装（AR描画とは独立） -->
    <div id="sparkle-layer" style="display: none;"></div>
    <script>
      const layer = document.getElementById('sparkle-layer');
      const sparkleCount = 18;
      for (let i = 0; i < sparkleCount; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        // キャラが表示される画面中央付近にランダム配置
        const cx = 50 + (Math.random() * 30 - 15); // 中央±15%
        const cy = 50 + (Math.random() * 30 - 15);
        s.style.left = cx + '%';
        s.style.top = cy + '%';
        const size = 4 + Math.random() * 5;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.2) + 's';
        s.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
        layer.appendChild(s);
      }

      // マーカーの検出状態とキラキラの表示を連動させる
      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.querySelector('a-scene');
        const targetEl = document.querySelector('[mindar-image-target]');
        if (!targetEl) return;

        targetEl.addEventListener('targetFound', () => {
          layer.style.display = 'block';
        });
        targetEl.addEventListener('targetLost', () => {
          layer.style.display = 'none';
        });
      });
    </script>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true; alpha: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="character" src="./marker.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <!-- メインキャラクター：弾むように登場 -->
        <a-plane
          class="clickable"
          click-to-link="url: https://isc.iwasaki.ac.jp/"
          src="#character"
          material="transparent: true; opacity: 1; shader: flat;"
          position="0 -0.3 0.5"
          height="1"
          width="1"
          scale="0.3 0.3 0.3"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; easing: easeOutQuad"
          animation__scale="property: scale; from: 0.3 0.3 0.3; to: 1 1 1; dur: 1000; easing: easeOutElastic"
          animation__slide="property: position; from: 0 -0.3 0.5; to: 0 0 0.5; dur: 1000; easing: easeOutBack"
          animation__float="property: position; from: 0 0 0.5; to: 0 0.08 0.5; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine; delay: 1000">
        </a-plane>

        <!-- Tap Here：リング＋テキストの両方をクリック領域にする -->
        <a-ring
          class="clickable"
          click-to-link="url: https://isc.iwasaki.ac.jp/"
          position="0 -0.65 0.5"
          radius-inner="0.09"
          radius-outer="0.11"
          color="#FFFFFF"
          material="transparent: true; opacity: 0; shader: flat;"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; delay: 1200; easing: easeOutQuad"
          animation__pulse="property: scale; from: 0.85 0.85 0.85; to: 1.25 1.25 1.25; dir: alternate; dur: 800; loop: true; easing: easeInOutSine; delay: 1200">
        </a-ring>
        <a-text
          class="clickable"
          click-to-link="url: https://isc.iwasaki.ac.jp/"
          value="TAP"
          align="center"
          width="1.2"
          position="0 -0.65 0.51"
          color="#FFFFFF"
          material="transparent: true; opacity: 0;"
          animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; delay: 1200; easing: easeOutQuad">
        </a-text>

      </a-entity>
    </a-scene>
  </body>
</html>
