<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      AFRAME.registerComponent('click-to-link', {
        init: function () {
          this.el.addEventListener('click', function () {
            window.location.href = 'https://isc.iwasaki.ac.jp/';
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./tafgets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 表示させたいJPG画像を指定 -->
        <img id="myJpgImage" src="./marker.jpg">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 平面（a-plane）にJPG画像を貼り付けて表示 -->
        <a-plane 
          class="clickable"
          click-to-link
          src="#myJpgImage" 
          position="0 0 0" 
          height="1" 
          width="1" 
          rotation="0 0 0">
        </a-plane>
      </a-entity>
    </a-scene>
  </body>
</html>
