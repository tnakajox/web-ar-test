<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高島屋 −10歳ミラー</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 0 5px;
}

#status {
  margin: 5px;
}

#camera {
  position: relative;
  width: 90vw;
  max-width: 600px;
  margin: 20px auto;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
}

button {
  margin-top: 20px;
  padding: 16px 35px;
  font-size: 20px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
}

</style>
</head>


<body>

<h1>−10歳ミラー</h1>

<div id="status">
起動中...
</div>


<div id="camera">

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <canvas
    id="canvas">
  </canvas>

</div>


<button id="beautyButton">
✨ 若返る
</button>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from
"https://esm.sh/@mediapipe/tasks-vision";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");


let faceLandmarker;

let beautyMode = false;


// =====================================
// MediaPipe
// =====================================

async function setup() {

  try {

    const vision =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
      );


    faceLandmarker =
      await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {

            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

          },

          runningMode: "VIDEO",

          numFaces: 1
        }
      );


    status.textContent =
      "カメラ起動中";


    startCamera();


  } catch (error) {

    console.error(error);

    status.textContent =
      "MediaPipeエラー";

  }

}


// =====================================
// カメラ
// =====================================

async function startCamera() {

  const stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: "user",

        width: 1280,

        height: 720

      }

    });


  video.srcObject = stream;


  video.addEventListener(
    "loadeddata",
    () => {

      status.textContent =
        "顔を映してください";

      detect();

    }
  );

}


// =====================================
// 顔認識
// =====================================

function detect() {

  if (!faceLandmarker) {
    return;
  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const result =
    faceLandmarker.detectForVideo(
      video,
      performance.now()
    );


  // -----------------------------------
  // 元映像
  // -----------------------------------

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  // -----------------------------------
  // 顔発見
  // -----------------------------------

  if (
    result.faceLandmarks.length > 0
  ) {

    const face =
      result.faceLandmarks[0];


    status.textContent =
      beautyMode
        ? "✨ 若返り中"
        : "顔を認識しました";


    if (beautyMode) {

      beauty(face);

    }

  }


  requestAnimationFrame(
    detect
  );

}


// =====================================
// 美容処理
// =====================================

function beauty(face) {

  /*
   * 左目
   */

  const leftEye =
    getEyeCenter(
      face,
      [
        33,
        133,
        159,
        145
      ]
    );


  /*
   * 右目
   */

  const rightEye =
    getEyeCenter(
      face,
      [
        362,
        263,
        386,
        374
      ]
    );


  /*
   * 目を自然に強調
   */

  drawEyeEffect(
    leftEye.x,
    leftEye.y,
    leftEye.width,
    leftEye.height
  );


  drawEyeEffect(
    rightEye.x,
    rightEye.y,
    rightEye.width,
    rightEye.height
  );


  /*
   * 美肌
   */

  skinEffect(face);

}


// =====================================
// 目の中心・サイズ
// =====================================

function getEyeCenter(
  face,
  indexes
) {

  let minX = 1;
  let maxX = 0;

  let minY = 1;
  let maxY = 0;


  indexes.forEach(
    index => {

      const p =
        face[index];


      minX =
        Math.min(
          minX,
          p.x
        );


      maxX =
        Math.max(
          maxX,
          p.x
        );


      minY =
        Math.min(
          minY,
          p.y
        );


      maxY =
        Math.max(
          maxY,
          p.y
        );

    }
  );


  return {

    x:
      ((minX + maxX) / 2)
      * canvas.width,

    y:
      ((minY + maxY) / 2)
      * canvas.height,

    width:
      (maxX - minX)
      * canvas.width,

    height:
      (maxY - minY)
      * canvas.height

  };

}


// =====================================
// 目の自然な強調
// =====================================

function drawEyeEffect(
  x,
  y,
  width,
  height
) {

  /*
   * 強くしすぎない
   */

  const scale =
    1.08;


  const w =
    width * 2.5;

  const h =
    height * 3;


  ctx.save();


  /*
   * 楕円形にマスク
   */

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    w / 2,
    h / 2,
    0,
    0,
    Math.PI * 2
  );

  ctx.clip();


  /*
   * 中心から拡大
   */

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );

  ctx.translate(
    -x,
    -y
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();

}


// =====================================
// 美肌
// =====================================

function skinEffect(face) {

  /*
   * 顔全体の範囲を取得
   */

  let minX = 1;
  let maxX = 0;

  let minY = 1;
  let maxY = 0;


  face.forEach(
    p => {

      minX =
        Math.min(
          minX,
          p.x
        );

      maxX =
        Math.max(
          maxX,
          p.x
        );

      minY =
        Math.min(
          minY,
          p.y
        );

      maxY =
        Math.max(
          maxY,
          p.y
        );

    }
  );


  const x =
    minX * canvas.width;

  const y =
    minY * canvas.height;

  const w =
    (maxX - minX)
    * canvas.width;

  const h =
    (maxY - minY)
    * canvas.height;


  /*
   * 顔だけに薄い明るさを加える
   */

  ctx.save();

  ctx.globalAlpha =
    0.08;

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.ellipse(
    x + w / 2,
    y + h / 2,
    w / 2,
    h / 2,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}


// =====================================
// ボタン
// =====================================

document
  .getElementById(
    "beautyButton"
  )
  .addEventListener(
    "click",
    () => {

      beautyMode =
        !beautyMode;


      document
        .getElementById(
          "beautyButton"
        )
        .textContent =

        beautyMode
          ? "✨ 若返りON"
          : "✨ 若返る";

    }
  );


setup();

</script>

</body>
</html>
