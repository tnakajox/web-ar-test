<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>高島屋 花吹雪AR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* カメラ */
    #video {
      display: none;
    }

    /* 画面 */
    #canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);
    }

    /* タイトル */

    #title {
      position: fixed;

      top: 25px;
      left: 0;
      width: 100%;

      text-align: center;

      color: white;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.5);

      pointer-events: none;

      z-index: 10;
    }

    #title h1 {
      margin: 0;

      font-size: 28px;

      font-weight: 500;
    }

    #title p {
      margin: 8px 0;

      font-size: 14px;
    }

    /* ボタン */

    #flowerButton {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 20;

      border: none;

      padding: 16px 32px;

      border-radius: 50px;

      background: rgba(255,255,255,0.9);

      color: #333;

      font-size: 18px;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.3);
    }

    #flowerButton:active {

      transform:
        translateX(-50%)
        scale(0.95);
    }

    /* 撮影ボタン */

    #photoButton {

      position: fixed;

      right: 20px;
      bottom: 40px;

      z-index: 20;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      border: 3px solid white;

      background: rgba(0,0,0,0.3);

      color: white;

      font-size: 22px;

      cursor: pointer;
    }

  </style>

</head>


<body>


  <!-- カメラ -->

  <div id="camera">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <canvas
      id="canvas"
    ></canvas>

  </div>


  <!-- タイトル -->

  <div id="title">

    <h1>
      花吹雪
    </h1>

    <p>
      あなたのまわりに、花を咲かせよう。
    </p>

  </div>


  <!-- 花ボタン -->

  <button
    id="flowerButton"
  >
    🌸 花を咲かせる
  </button>


  <!-- 撮影 -->

  <button
    id="photoButton"
  >
    📷
  </button>


<script>


// ==================================================
// 基本設定
// ==================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const flowerButton =
  document.getElementById("flowerButton");

const photoButton =
  document.getElementById("photoButton");


// 花の種類

const flowers = [
  "🌸",
  "🌼",
  "🌷",
  "🌺",
  "💮"
];


// 現在存在する花

let flowerList = [];


// 花を増やすか

let flowerMode = false;


// ==================================================
// カメラ起動
// ==================================================

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    video.addEventListener(
      "loadeddata",
      () => {

        resizeCanvas();

        animation();

      }
    );


  } catch (error) {

    console.error(error);

    alert(
      "カメラを使用できません。\n" +
      "ブラウザのカメラ許可を確認してください。"
    );

  }

}


// ==================================================
// Canvasサイズ
// ==================================================

function resizeCanvas() {

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

}


// ウインドウサイズ変更

window.addEventListener(
  "resize",
  resizeCanvas
);


// ==================================================
// 花を作る
// ==================================================

function createFlower(
  x = Math.random() * canvas.width,
  y = -50
) {

  const flower = {

    // 位置

    x: x,

    y: y,


    // 大きさ

    size:
      20 +
      Math.random() * 35,


    // 落下速度

    speed:
      0.8 +
      Math.random() * 2.0,


    // 横揺れ

    sway:
      Math.random() *
      Math.PI *
      2,


    swaySpeed:
      0.01 +
      Math.random() * 0.03,


    swayAmount:
      0.3 +
      Math.random() * 1.5,


    // 回転

    rotation:
      Math.random() *
      Math.PI *
      2,


    rotationSpeed:
      (Math.random() - 0.5)
      * 0.04,


    // 花の種類

    type:
      flowers[
        Math.floor(
          Math.random()
          * flowers.length
        )
      ],


    // 少し透明

    alpha:
      0.7 +
      Math.random() * 0.3

  };


  flowerList.push(
    flower
  );

}


// ==================================================
// 花を大量発生
// ==================================================

function burstFlowers() {

  for (
    let i = 0;
    i < 35;
    i++
  ) {

    createFlower(

      Math.random()
      * canvas.width,

      Math.random()
      * canvas.height

    );

  }

}


// ==================================================
// 花を描く
// ==================================================

function drawFlowers() {

  for (
    let i =
      flowerList.length - 1;

    i >= 0;

    i--

  ) {

    const flower =
      flowerList[i];


    // --------------------------
    // 移動
    // --------------------------

    flower.y +=
      flower.speed;


    flower.sway +=
      flower.swaySpeed;


    flower.x +=
      Math.sin(
        flower.sway
      )
      * flower.swayAmount;


    flower.rotation +=
      flower.rotationSpeed;


    // --------------------------
    // 描画
    // --------------------------

    ctx.save();


    ctx.globalAlpha =
      flower.alpha;


    ctx.translate(
      flower.x,
      flower.y
    );


    ctx.rotate(
      flower.rotation
    );


    ctx.font =
      `${flower.size}px serif`;


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(
      flower.type,
      0,
      0
    );


    ctx.restore();


    // --------------------------
    // 画面外
    // --------------------------

    if (
      flower.y >
      canvas.height + 80
    ) {

      flowerList.splice(
        i,
        1
      );

    }

  }

}


// ==================================================
// 花を自動追加
// ==================================================

setInterval(
  () => {

    if (!flowerMode) {
      return;
    }


    createFlower();

  },

  150
);


// ==================================================
// メインループ
// ==================================================

function animation() {


  // --------------------------
  // カメラ映像
  // --------------------------

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  // --------------------------
  // 花
  // --------------------------

  drawFlowers();


  requestAnimationFrame(
    animation
  );

}


// ==================================================
// 花ボタン
// ==================================================

flowerButton.addEventListener(
  "click",
  () => {

    flowerMode =
      !flowerMode;


    if (flowerMode) {

      flowerButton.textContent =
        "🌸 花吹雪 ON";


      // 最初に大量発生

      burstFlowers();

    }
    else {

      flowerButton.textContent =
        "🌸 花を咲かせる";

    }

  }
);


// ==================================================
// 撮影
// ==================================================

photoButton.addEventListener(
  "click",
  () => {


    // Canvasを画像化

    const image =
      canvas.toDataURL(
        "image/png"
      );


    // ダウンロード

    const link =
      document.createElement(
        "a"
      );


    link.href =
      image;


    link.download =
      "takashimaya-flower.png";


    link.click();

  }
);


// ==================================================
// 起動
// ==================================================

startCamera();


</script>

</body>

</html>
