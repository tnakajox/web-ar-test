<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>高島屋 −10歳ミラー</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  text-align: center;
  font-family: sans-serif;
}

h1 {
  margin: 20px 0 5px;
}

#camera {
  position: relative;
  width: 90vw;
  max-width: 600px;
  margin: 20px auto;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
}

button {
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>−10歳ミラー</h1>

<p id="status">起動中...</p>

<div id="camera">

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <canvas id="canvas"></canvas>

</div>

<button id="beautyButton">
✨ 若返る
</button>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from
"https://esm.sh/@mediapipe/tasks-vision";


const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

let faceLandmarker;

let beautyMode = false;


// --------------------------------
// MediaPipe
// --------------------------------

async function setup() {

  try {

    const vision =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
      );

    faceLandmarker =
      await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          },

          runningMode: "VIDEO",

          numFaces: 1
        }
      );

    status.textContent =
      "カメラ起動中";

    startCamera();

  } catch (error) {

    console.error(error);

    status.textContent =
      "MediaPipeエラー";

  }

}


// --------------------------------
// カメラ
// --------------------------------

async function startCamera() {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      }
    });

  video.srcObject = stream;

  video.addEventListener(
    "loadeddata",
    () => {

      status.textContent =
        "顔を映してください";

      detect();

    }
  );

}


// --------------------------------
// 顔検出
// --------------------------------

function detect() {

  if (!faceLandmarker) return;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const result =
    faceLandmarker.detectForVideo(
      video,
      performance.now()
    );


  // カメラ映像をcanvasに描く

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (
    beautyMode &&
    result.faceLandmarks.length > 0
  ) {

    const face =
      result.faceLandmarks[0];

    enlargeEyes(face);

    status.textContent =
      "✨ −10歳モード";

  }
  else if (
    result.faceLandmarks.length > 0
  ) {

    status.textContent =
      "顔を認識しました";

  }


  requestAnimationFrame(detect);

}


// --------------------------------
// 目を大きくする
// --------------------------------

function enlargeEyes(face) {

  // 左目の中心

  const leftEye =
    getPoint(face, 159, 145);


  // 右目の中心

  const rightEye =
    getPoint(face, 386, 374);


  enlargeEye(
    leftEye.x,
    leftEye.y,
    55
  );

  enlargeEye(
    rightEye.x,
    rightEye.y,
    55
  );

}


// --------------------------------
// 2点の中心
// --------------------------------

function getPoint(
  face,
  index1,
  index2
) {

  const p1 = face[index1];
  const p2 = face[index2];

  return {

    x:
      ((p1.x + p2.x) / 2)
      * canvas.width,

    y:
      ((p1.y + p2.y) / 2)
      * canvas.height

  };

}


// --------------------------------
// 目を拡大
// --------------------------------

function enlargeEye(
  x,
  y,
  radius
) {

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.clip();


  // 目の周囲を少し拡大

  const scale = 1.20;

  const size =
    radius * 2;

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );

  ctx.translate(
    -x,
    -y
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();

}


// --------------------------------
// ボタン
// --------------------------------

document
  .getElementById("beautyButton")
  .addEventListener(
    "click",
    () => {

      beautyMode =
        !beautyMode;

      document
        .getElementById("beautyButton")
        .textContent =
          beautyMode
            ? "✨ 若返りON"
            : "✨ 若返る";

    }
  );


setup();

</script>

</body>
</html>
