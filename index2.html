<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>高島屋 −10歳ミラー</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    p {
      margin-top: 5px;
    }

    #camera {
      position: relative;
      width: min(90vw, 600px);
      margin: auto;
    }

    video {
      width: 100%;
      border-radius: 20px;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>−10歳ミラー</h1>
  <p>あなたは何歳若返る？</p>

  <div id="camera">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="beautyButton">
    ✨ 若返る
  </button>


  <!-- MediaPipe -->
  <script type="module">

    import {
      FaceLandmarker,
      FilesetResolver
    } from
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let beautyMode = false;
    let faceLandmarker;


    // --------------------------------
    // MediaPipeを読み込む
    // --------------------------------

    async function setupFaceLandmarker() {

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            },

            runningMode: "VIDEO",

            numFaces: 1
          }
        );

      startCamera();
    }


    // --------------------------------
    // カメラ
    // --------------------------------

    async function startCamera() {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          }
        });

      video.srcObject = stream;

      video.addEventListener(
        "loadeddata",
        detectFace
      );
    }


    // --------------------------------
    // 顔検出
    // --------------------------------

    async function detectFace() {

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const result =
        faceLandmarker.detectForVideo(
          video,
          performance.now()
        );

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      if (
        beautyMode &&
        result.faceLandmarks.length > 0
      ) {

        const face =
          result.faceLandmarks[0];

        makeBeauty(face);
      }


      requestAnimationFrame(
        detectFace
      );
    }


    // --------------------------------
    // 美肌＋目を大きく
    // --------------------------------

    function makeBeauty(face) {

      /*
        MediaPipeの顔座標は
        0〜1の範囲
      */

      // 左目
      const leftEye =
        face[159];

      // 右目
      const rightEye =
        face[386];


      // ------------------------------
      // 目を大きくする
      // ------------------------------

      enlargeEye(
        leftEye.x * canvas.width,
        leftEye.y * canvas.height
      );

      enlargeEye(
        rightEye.x * canvas.width,
        rightEye.y * canvas.height
      );


      // ------------------------------
      // 美肌フィルター
      // ------------------------------

      ctx.fillStyle =
        "rgba(255, 220, 220, 0.08)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );
    }


    function enlargeEye(x, y) {

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        45,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "rgba(255,255,255,0.15)";

      ctx.fill();
    }


    // --------------------------------
    // ボタン
    // --------------------------------

    document
      .getElementById("beautyButton")
      .addEventListener(
        "click",
        () => {

          beautyMode =
            !beautyMode;

          document
            .getElementById("beautyButton")
            .textContent =
              beautyMode
                ? "✨ 若返りON"
                : "✨ 若返る";
        }
      );


    setupFaceLandmarker();

  </script>

</body>
</html>
